services:
  deployment-manager:
    build: .
    image: deployment-manager:latest
    container_name: deployment-manager
    # Direct port exposure is disabled to ensure all external traffic goes through the Nginx proxy
    # ports:
    #   - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      # Common settings
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=change-this-to-a-secure-random-key-in-production
      # Only set this to 'true' if the Nginx service below (or another
      # reverse proxy) is what clients actually connect to — never if this
      # container is reachable directly, since clients could then spoof the
      # X-Forwarded-Proto/-For headers themselves.
      # - TRUST_PROXY=true

      # ----------------------------------------------------
      # OPTION 1: Trusted Header Single Sign-On (SSO)
      # ----------------------------------------------------
      # - SSO_HEADER: Name of the header containing the authenticated user's name
      #   (injected by reverse proxies like OAuth2 Proxy, Authelia, or Nginx)
      # ----------------------------------------------------
      - SSO_HEADER=X-Remote-User
      # ----------------------------------------------------
      # OPTION 2: Keycloak / OpenID Connect (OIDC) SSO
      # ----------------------------------------------------
      # - OIDC_ISSUER: The base Keycloak realm URL (discovers configuration automatically)
      # - OIDC_CLIENT_ID: Registered client ID (default: deployment-manager)
      # - OIDC_CLIENT_SECRET: Client Secret (optional, only for confidential clients)
      # - OIDC_REDIRECT_URI: Registered callback endpoint URL
      # ----------------------------------------------------
      # - OIDC_ISSUER=http://localhost:8080/realms/myrealm
      # - OIDC_CLIENT_ID=deployment-manager
      # - OIDC_REDIRECT_URI=http://localhost:3000/api/auth/oidc/callback
      # - OIDC_CLIENT_SECRET=your-client-secret (optional)
      # If Keycloak's TLS cert is signed by an internal/intranet CA (or self-signed),
      # mount the CA cert into the container and trust it explicitly:
      # - OIDC_CA_CERT_PATH=/app/certs/ca.crt
      # Only as a last resort for internal/test environments:
      # - OIDC_TLS_REJECT_UNAUTHORIZED=false

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: deployment-manager-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - deployment-manager
    restart: unless-stopped
