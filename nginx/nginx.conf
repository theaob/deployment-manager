# Nginx reverse proxy configuration for Deployment Manager

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Standard logs
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Backend upstream pointing to the node service in docker-compose
    upstream backend {
        server deployment-manager:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------------
        # AUTOMATIC WINDOWS / AD LOGON (Kerberos / SPNEGO)
        # ----------------------------------------------------------------------
        # To enable automated local domain login via Nginx, you need an Nginx
        # build with the 'nginx-http-auth-spnego' module.
        #
        # Configuration steps:
        # 1. Generate a Kerberos keytab file on your AD Domain Controller:
        #    ktpass /out nginx.keytab /princ HTTP/your-server-fqdn@YOURDOMAIN.COM /mapuser your_service_account /crypto AES256-SHA1 /ptype KRB5_NT_PRINCIPAL /pass your_password
        #
        # 2. Mount/place the 'nginx.keytab' file into the Nginx container (e.g. /etc/nginx/nginx.keytab).
        # 3. Configure the Kerberos authentication directives below inside this 'location /' block.
        # ----------------------------------------------------------------------

        location / {
            # --- Enable SPNEGO/Kerberos (Uncomment below if using custom/SPNEGO image) ---
            # auth_gss on;
            # auth_gss_realm YOURDOMAIN.COM;
            # auth_gss_keytab /etc/nginx/nginx.keytab;
            # auth_gss_service_name HTTP/your-server-fqdn;
            
            # --- For Testing / Local Development without Active Directory ---
            # You can uncomment the line below to simulate a logged-in domain user:
            # proxy_set_header X-Remote-User "john.doe";

            # Pass the authenticated user to the backend
            # When SPNEGO is enabled, Nginx populates $remote_user with the Kerberos principal
            proxy_set_header X-Remote-User $remote_user;

            # Prevent users from spoofing the header by stripping any existing incoming X-Remote-User
            proxy_set_header X-Remote-User-Original "";

            # Standard proxy configuration
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
